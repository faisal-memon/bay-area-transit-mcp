name: Release Build

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version_bump:
        description: Version segment to increment
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  pull-requests: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: muni-mcp/package-lock.json
      - name: Install and build Worker
        working-directory: muni-mcp
        run: npm ci && npm run build
      - name: Bump version tag
        id: bump
        uses: faisal-memon/pr-label-semver@v0
        with:
          version-bump: ${{ github.event_name == 'workflow_dispatch' && inputs.version_bump || '' }}
          github-token: ${{ github.token }}
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Muni MCP image
        uses: docker/build-push-action@v6
        with:
          context: muni-mcp
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/muni-mcp:${{ steps.bump.outputs.new-tag }}
            ghcr.io/${{ github.repository_owner }}/muni-mcp:latest
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bump.outputs.new-tag }}
          generate_release_notes: true
